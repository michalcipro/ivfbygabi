/*__FONTS__*/

:root {

  --gold: #c8a878;

  --page: var(--cream);
  --card: var(--porcelain);
  --card-muted: var(--linen);
  --line: #e8e0d5;
  --fg: #2b2521;
  --fg-soft: #6c6058;
  --fg-faint: #9a8f86;

  --display: 'Cormorant Garamond', 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif;

  --r-xs: 0.5rem;
  --r-sm: 0.75rem;
  --r-md: 1.125rem;
  --r-lg: 1.5rem;

  --veil: 0 1px 2px rgb(43 37 33 / 0.03), 0 8px 24px -12px rgb(43 37 33 / 0.1);
  --lift: 0 2px 4px rgb(43 37 33 / 0.04), 0 18px 44px -20px rgb(43 37 33 / 0.18);

  color-scheme: light;
}

}

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }

}

<div id="app"></div>

<script>
const DATA = /*__DATA__*/;

/* ------------------------------------------------------------------ stav -- */

const HERO = {
  champagne: 'linear-gradient(135deg, #f2e3cd 0%, #e2cbaa 55%, #cdb08c 100%)',
  taupe: 'linear-gradient(135deg, #cbbdae 0%, #a3907c 60%, #7b6a59 100%)',
  blush: 'linear-gradient(135deg, #f3e2dd 0%, #e3cec7 55%, #c9a89f 100%)',
  sage: 'linear-gradient(135deg, #e2e8dd 0%, #bfcabb 60%, #93a28c 100%)',
  sky: 'linear-gradient(135deg, #dfe6ec 0%, #c3cdd6 60%, #94a4b0 100%)',
  linen: 'linear-gradient(135deg, #faf5ee 0%, #efe5d6 60%, #ded0bb 100%)',
  sand: 'linear-gradient(135deg, #ece0d1 0%, #ddcdb8 60%, #c2ac92 100%)',
  dusk: 'linear-gradient(145deg, #b8a698 0%, #8d7a6c 45%, #5d4f45 100%)',
  dawn: 'linear-gradient(135deg, #fdf1e5 0%, #f0d9c6 45%, #dcb9a0 100%)',
  pearl: 'linear-gradient(135deg, #ffffff 0%, #f3efe8 55%, #e3dcd0 100%)',
};

const NAV_PRIMARY = [
  { id: 'dnes', label: 'Dnes', icon: '☀' },
  { id: 'objevit', label: 'Objevit', icon: '❋' },
  { id: 'gabi', label: 'Gabi', icon: '✦' },
  { id: 'denik', label: 'Deník', icon: '✎' },
  { id: 'komunita', label: 'Komunita', icon: '◍' },
];
const NAV_SECONDARY = [
  { id: 'pruvodce', label: 'Průvodce', icon: '❖' },
  { id: 'knihovna', label: 'Knihovna', icon: '❧' },
  { id: 'kalendar', label: 'Kalendář', icon: '◈' },
  { id: 'zdravi', label: 'Zdraví', icon: '◉' },
  { id: 'pribeh', label: 'Můj příběh', icon: '❦' },
  { id: 'obchod', label: 'Doporučené', icon: '◇' },
  { id: 'partner', label: 'Partner', icon: '♡' },
];

const BY_ID = new Map(DATA.catalog.map((c) => [c.id, c]));

const S = {
  persona: 0,
  day: DATA.personas[0].days.findIndex((d) => d.offset === 0),
  screen: 'dnes',
  open: null,
  query: '',
  kind: 'vse',
  phase: null,
  chat: [],
  mood: null,
  done: {},
  checked: {},
  quiz: {},
};

const persona = () => DATA.personas[S.persona];
const day = () => persona().days[S.day];

/* -------------------------------------------------------------- pomocníci -- */

const esc = (s) =>
  String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const inline = (s) =>
  esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>');

/** Stejná podmnožina markdownu jako v aplikaci: ## ### - 1. > a tabulky. */
function md(text) {
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  const out = [];
  let para = [];
  let list = null;
  let table = null;

  const flushPara = () => { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } };
  const flushList = () => {
    if (!list) return;
    out.push('<' + list.type + '>' + list.items.map((i) => '<li>' + inline(i) + '</li>').join('') + '</' + list.type + '>');
    list = null;
  };
  const flushTable = () => {
    if (!table) return;
    const head = '<tr>' + table.head.map((c) => '<th>' + inline(c) + '</th>').join('') + '</tr>';
    const rows = table.rows.map((r) => '<tr>' + r.map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('');
    out.push('<div class="tablewrap"><table><thead>' + head + '</thead><tbody>' + rows + '</tbody></table></div>');
    table = null;
  };
  const cells = (line) => line.replace(/^\||\|$/g, '').split('|').map((c) => c.trim());

  for (const raw of lines) {
    const line = raw.trimEnd();
    if (!line.trim()) { flushPara(); flushList(); flushTable(); continue; }

    if (/^\|.*\|$/.test(line)) {
      flushPara(); flushList();
      if (/^\|[\s:|-]+\|$/.test(line)) continue;
      if (!table) table = { head: cells(line), rows: [] };
      else table.rows.push(cells(line));
      continue;
    }
    flushTable();

    let m;
    if ((m = line.match(/^###\s+(.*)$/))) { flushPara(); flushList(); out.push('<h3>' + inline(m[1]) + '</h3>'); continue; }
    if ((m = line.match(/^##\s+(.*)$/))) { flushPara(); flushList(); out.push('<h2>' + inline(m[1]) + '</h2>'); continue; }
    if ((m = line.match(/^>\s+(.*)$/))) { flushPara(); flushList(); out.push('<blockquote>' + inline(m[1]) + '</blockquote>'); continue; }
    if ((m = line.match(/^[-*]\s+(.*)$/))) {
      flushPara();
      if (!list || list.type !== 'ul') { flushList(); list = { type: 'ul', items: [] }; }
      list.items.push(m[1]); continue;
    }
    if ((m = line.match(/^\d+\.\s+(.*)$/))) {
      flushPara();
      if (!list || list.type !== 'ol') { flushList(); list = { type: 'ol', items: [] }; }
      list.items.push(m[1]); continue;
    }
    flushList();
    para.push(line.trim());
  }
  flushPara(); flushList(); flushTable();
  return out.join('');
}

const heroStyle = (token) => 'background:' + (HERO[token] || HERO.linen);

function contentCard(item, reason) {
  if (!item) return '';
  return (
    '<button class="ccard" data-open="' + esc(item.id) + '">' +
      '<div class="hero grain" style="' + heroStyle(item.hero) + '">' +
        '<div class="meta">' +
          '<span class="pill-kind">' + esc(DATA.kindIcons[item.kind]) + ' ' + esc(DATA.kindLabels[item.kind]) + '</span>' +
          '<span class="pill-min num">' + item.minutes + ' min</span>' +
        '</div>' +
      '</div>' +
      '<div class="body">' +
        (reason ? '<p class="eyebrow" style="margin-bottom:.5rem">' + esc(reason) + '</p>' : '') +
        '<h3 class="display">' + esc(item.title) + '</h3>' +
        '<p>' + esc(item.excerpt) + '</p>' +
      '</div>' +
    '</button>'
  );
}

function railBlock(rail) {
  const items = rail.items.map((id) => BY_ID.get(id)).filter(Boolean);
  if (!items.length) return '';
  return (
    '<section class="rise">' +
      '<div class="section-title"><div><h2 class="display">' + esc(rail.title) + '</h2>' +
      '<p>' + esc(rail.reason) + '</p></div></div>' +
      '<div class="rail">' + items.map((i) => contentCard(i)).join('') + '</div>' +
    '</section>'
  );
}

function ring(value) {
  if (value == null) return '';
  const r = 27;
  const c = 2 * Math.PI * r;
  return (
    '<div style="position:relative;flex:none;width:62px;height:62px">' +
      '<svg class="ring" width="62" height="62" viewBox="0 0 62 62" aria-hidden="true">' +
        '<circle cx="31" cy="31" r="' + r + '" stroke="var(--line)"></circle>' +
        '<circle cx="31" cy="31" r="' + r + '" stroke="var(--taupe)" stroke-linecap="round" ' +
        'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + (c * (1 - value)).toFixed(1) + '"></circle>' +
      '</svg>' +
      '<span class="num" style="position:absolute;inset:0;display:grid;place-items:center;font-size:.75rem;color:var(--fg-soft)">' +
      Math.round(value * 100) + ' %</span>' +
    '</div>'
  );
}

/* ---------------------------------------------------------------- obrazovky -- */

function screenDnes() {
  const d = day();
  const p = persona();
  const card = d.card;
  const feature = d.featureId ? BY_ID.get(d.featureId) : null;

  const head =
    '<header class="rise">' +
      '<div class="row" style="gap:.6rem;flex-wrap:wrap"><p class="eyebrow">' + esc(d.dateLabel) + '</p>' +
      (d.offset === 0 ? '<span class="badge badge-soft">dnes</span>' : '<span class="badge">' + (d.offset < 0 ? 'včera' : 'za ' + d.offset + ' dní') + '</span>') +
      '</div>' +
      '<h1 class="display" style="font-size:clamp(2rem,4.5vw,3rem);margin-top:.75rem">Dobrý den, ' + esc(p.name) + '.</h1>' +
      '<p class="soft" style="margin-top:.6rem;font-size:1.0625rem">' + esc(d.dayLabel) + '</p>' +
      (d.gestationLabel ? '<p class="faint" style="margin-top:.25rem;font-size:.875rem">Gestační stáří ' + esc(d.gestationLabel) + '</p>' : '') +
      (d.babyAgeLabel ? '<p class="faint" style="margin-top:.25rem;font-size:.875rem">' + esc(d.babyAgeLabel) + (d.usesCorrectedAge ? ' · počítáno korigovaně' : '') + '</p>' : '') +
    '</header>';

  const cardBlock = card
    ? '<section class="rise"><div class="daycard grain" style="' + heroStyle('linen') + '">' +
        '<div class="inner">' +
          '<div class="row" style="justify-content:space-between;align-items:flex-start;gap:1.5rem">' +
            '<div style="min-width:0"><p class="eyebrow">Dnešní téma</p>' +
            '<h2 class="display">' + esc(card.headline) + '</h2></div>' +
            ring(d.progress) +
          '</div>' +
          '<p class="lede">' + esc(card.body) + '</p>' +
          (card.whatsHappening && card.whatsHappening.length
            ? '<div style="margin-top:1.9rem"><p class="eyebrow">Co se dnes může dít</p><ul class="bullets">' +
              card.whatsHappening.map((w) => '<li>' + esc(w) + '</li>').join('') + '</ul></div>'
            : '') +
          (card.tip ? '<p class="tipbox"><strong>Tip: </strong>' + esc(card.tip) + '</p>' : '') +
          (card.callDoctorIf && card.callDoctorIf.length
            ? '<div class="doctorbox"><p style="font-size:.8125rem;font-weight:600">Ozvěte se lékaři, pokud:</p><ul>' +
              card.callDoctorIf.map((c) => '<li>' + esc(c) + '</li>').join('') + '</ul></div>'
            : '') +
        '</div>' +
      '</div></section>'
    : '<section class="surface" style="padding:2rem"><h2 class="display" style="font-size:1.5rem">' + esc(d.phaseTitle) + '</h2><p class="soft" style="margin-top:.75rem">' + esc(d.phaseDescription) + '</p></section>';

  const task = card && card.task
    ? '<div class="surface" style="padding:1.5rem"><p class="eyebrow">Dnešní úkol</p>' +
      '<button class="check" data-task="1" aria-pressed="' + (S.done[d.date] ? 'true' : 'false') + '" style="margin-top:.9rem">' +
      '<span class="box">✓</span><span class="txt" style="font-size:.9375rem;line-height:1.6">' + esc(card.task) + '</span></button></div>'
    : '';

  const mood =
    '<div class="surface" style="padding:1.5rem"><p class="eyebrow">Jak vám dnes je?</p>' +
      '<div class="mood">' +
        [1, 2, 3, 4, 5].map((v) => '<button data-mood="' + v + '" aria-pressed="' + (S.mood === v ? 'true' : 'false') + '" aria-label="Nálada ' + v + ' z 5">' + ['😞', '😔', '😐', '🙂', '😊'][v - 1] + '</button>').join('') +
      '</div>' +
      (S.mood ? '<p class="faint" style="margin-top:.8rem;font-size:.8125rem">Zapsáno. V deníku uvidíte, jak se to vyvíjí.</p>' : '') +
    '</div>';

  const memories = d.memories.length
    ? '<section class="rise"><div class="section-title"><div><h2 class="display">Na dnešek si vzpomínáme</h2><p>Z vaší kroniky</p></div></div>' +
      d.memories.map((m) =>
        '<div class="surface-muted" style="padding:1.25rem;display:flex;gap:1rem;margin-bottom:.75rem">' +
        '<span style="color:var(--taupe);font-size:1.15rem">' + esc(m.icon || '❦') + '</span><div>' +
        '<p style="font-weight:500;font-size:.9375rem">' + esc(m.label) + '</p>' +
        (m.body ? '<p class="soft" style="margin-top:.35rem;font-size:.875rem;line-height:1.6">' + esc(m.body) + '</p>' : '') +
        '</div></div>').join('') +
      '</section>'
    : '';

  const featureBlock = feature
    ? '<section class="rise"><div class="section-title"><h2 class="display">Dnešní doporučení</h2></div>' +
      '<button class="featurecard" data-open="' + esc(feature.id) + '">' +
        '<div class="hero grain" style="' + heroStyle(feature.hero) + '">' +
          '<span class="pill-kind">' + esc(DATA.kindIcons[feature.kind]) + ' ' + esc(DATA.kindLabels[feature.kind]) + ' · ' + feature.minutes + ' min</span>' +
        '</div>' +
        '<div class="txt"><p class="eyebrow">' + esc(d.featureReason) + '</p>' +
        '<h3 class="display">' + esc(feature.title) + '</h3>' +
        '<p class="soft" style="margin-top:.75rem;font-size:.9375rem;line-height:1.6">' + esc(feature.excerpt) + '</p>' +
        '<span style="margin-top:1.5rem;font-size:.875rem;font-weight:500;color:var(--taupe-deep)">Otevřít →</span></div>' +
      '</button></section>'
    : '';

  const meds = p.meds.length
    ? '<div class="surface" style="padding:1.5rem"><h3 class="display" style="font-size:1.25rem">Dnešní léky</h3><ul class="linelist">' +
      p.meds.map((m) => '<li><span class="box" style="width:1.1rem;height:1.1rem;border-radius:99px;border:1px solid var(--line);flex:none"></span>' +
      '<span>' + esc(m.name) + (m.dose ? ' <span class="faint">· ' + esc(m.dose) + '</span>' : '') + '</span>' +
      (m.timeOfDay ? '<span class="faint num" style="margin-left:auto;font-size:.75rem">' + esc(m.timeOfDay) + '</span>' : '') + '</li>').join('') +
      '</ul></div>'
    : '';

  const upcoming = d.upcoming.length
    ? '<div class="surface" style="padding:1.5rem"><h3 class="display" style="font-size:1.25rem">Co vás čeká</h3><ul class="linelist">' +
      d.upcoming.map((e) => '<li><span class="when">' + (e.inDays === 0 ? 'dnes' : e.inDays === 1 ? 'zítra' : 'za ' + e.inDays + ' dní') + '</span>' +
      '<span>' + esc(e.title) + '</span></li>').join('') + '</ul></div>'
    : '';

  const enc = d.encouragement
    ? '<section class="rise"><div class="quote grain" style="' + heroStyle('dawn') + '">' +
      '<p>' + esc(d.encouragement.text) + '</p>' +
      (d.encouragement.author ? '<p class="by">' + esc(d.encouragement.author) + '</p>' : '') +
      '</div></section>'
    : '';

  const reflection = card && card.reflection
    ? '<section class="surface" style="padding:1.75rem"><p class="eyebrow">Večerní reflexe</p>' +
      '<p class="display" style="font-size:1.35rem;margin-top:.75rem;line-height:1.4">' + esc(card.reflection) + '</p>' +
      '<textarea class="searchbar" rows="3" placeholder="Můžete psát cokoliv. Nikdo jiný to neuvidí." style="margin-top:1rem;border-radius:var(--r-md);resize:vertical"></textarea></section>'
    : '';

  const next = d.nextMilestone
    ? '<div class="banner"><span style="color:var(--taupe)">◈</span><span>Nejbližší milník: <strong>' + esc(d.nextMilestone.label) + '</strong> za ' + esc(d.nextMilestone.human) + '</span></div>'
    : '';

  const intro =
    '<div class="banner"><span style="color:var(--taupe)">✦</span>' +
    '<span><strong>Náhled aplikace.</strong> Nahoře přepnete mezi ' + DATA.personas.length + ' profily, šipkami ‹ › posunete den — ' +
    'domovská stránka se přepočítá stejně jako v aplikaci. Obsah, doporučení i denní karty jsou skutečné: ' +
    DATA.stats.items + ' materiálů, ' + DATA.stats.dailyCards + ' denních karet, ' + DATA.stats.phases + ' fází cesty.</span></div>';

  return (
    intro + head + cardBlock +
    (task || mood ? '<section class="two">' + task + mood + '</section>' : '') +
    next + memories + featureBlock +
    (meds || upcoming ? '<section class="two">' + meds + upcoming + '</section>' : '') +
    d.rails.slice(0, 3).map(railBlock).join('') +
    enc + reflection +
    '<section style="border-top:1px solid var(--line);padding-top:2rem;text-align:center">' +
      '<p class="soft" style="font-size:.9375rem">Zítra tu na vás bude čekat něco nového.</p>' +
      '<button class="btn btn-ghost" data-day="1" style="margin-top:.75rem">Posunout na zítřek →</button>' +
    '</section>'
  );
}

function screenObjevit() {
  const d = day();
  return (
    '<header class="rise"><p class="eyebrow">IVF Netflix</p>' +
    '<h1 class="display" style="font-size:clamp(2rem,4.5vw,2.75rem);margin-top:.7rem">Objevit</h1>' +
    '<p class="soft" style="margin-top:.6rem">Řady se skládají podle toho, kolikátý je den vaší cesty. Zítra budou jiné.</p></header>' +
    d.rails.map(railBlock).join('')
  );
}

function screenPruvodce() {
  if (S.phase) {
    const ph = DATA.phases.find((p) => p.id === S.phase);
    const items = ph.items.map((id) => BY_ID.get(id)).filter(Boolean);
    return (
      '<button class="btn btn-ghost" data-phase="" style="align-self:flex-start">← Všechny fáze</button>' +
      '<header class="rise"><p class="eyebrow">' + esc(DATA.phaseGroups.find((g) => g.id === ph.group).name) + '</p>' +
      '<h1 class="display" style="font-size:clamp(2rem,4.5vw,2.75rem);margin-top:.7rem">' + esc(ph.title) + '</h1>' +
      '<p class="soft" style="margin-top:.75rem;font-size:1.0625rem;max-width:40rem;line-height:1.65">' + esc(ph.description) + '</p></header>' +
      '<div class="surface" style="padding:1.5rem"><dl class="kv">' +
        (ph.dayExample ? '<dt>Popisek dne</dt><dd>' + esc(ph.dayExample) + '</dd>' : '') +
        (ph.typicalDays ? '<dt>Typická délka</dt><dd class="num">' + ph.typicalDays + ' dní</dd>' : '<dt>Typická délka</dt><dd>bez pevné délky</dd>') +
        '<dt>Denních karet</dt><dd class="num">' + ph.cards + '</dd>' +
        '<dt>Odsud vede</dt><dd>' + ph.next.map((n) => esc(DATA.phases.find((x) => x.id === n).name)).join(' · ') + '</dd>' +
      '</dl></div>' +
      (items.length ? '<section><div class="section-title"><h2 class="display">Obsah pro tuhle fázi</h2></div><div class="grid-cards">' + items.map((i) => contentCard(i)).join('') + '</div></section>' : '')
    );
  }

  return (
    '<header class="rise"><p class="eyebrow">Celá cesta, ne jeden cyklus</p>' +
    '<h1 class="display" style="font-size:clamp(2rem,4.5vw,2.75rem);margin-top:.7rem">Průvodce</h1>' +
    '<p class="soft" style="margin-top:.6rem">' + DATA.phases.length + ' fází od prvního rozhodnutí po batolecí období. Vaše aktuální fáze je zvýrazněná.</p></header>' +
    DATA.phaseGroups.map((g) => {
      const phases = DATA.phases.filter((p) => p.group === g.id);
      return (
        '<section><div class="section-title"><div><h2 class="display">' + esc(g.name) + '</h2><p>' + esc(g.blurb) + '</p></div></div>' +
        '<div class="tiles">' +
        phases.map((p) => {
          const here = p.id === day().phaseId;
          return '<button class="tile" data-phase="' + esc(p.id) + '"' + (here ? ' style="border-color:var(--taupe);box-shadow:var(--veil)"' : '') + '>' +
            (here ? '<p class="eyebrow" style="color:var(--taupe-deep)">Jste tady</p>' : '') +
            '<h4 class="display">' + esc(p.name) + '</h4><p>' + esc(p.description) + '</p></button>';
        }).join('') +
        '</div></section>'
      );
    }).join('')
  );
}

function screenKnihovna() {
  const q = S.query.trim().toLowerCase();
  const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const nq = norm(q);
  let items = DATA.catalog;
  if (S.kind !== 'vse') items = items.filter((i) => i.kind === S.kind);
  if (nq.length > 1) items = items.filter((i) => norm(i.title + ' ' + i.excerpt + ' ' + i.body).includes(nq));

  const kinds = ['vse'].concat([...new Set(DATA.catalog.map((i) => i.kind))]);

  return (

function screenZdravi() {
  const p = persona();
  if (!p.labs.length) return '<p class="soft">Zatím žádné hodnoty.</p>';

  const chart = (series) => {
    const w = 680, h = 190, pad = 34;
    const vals = series.points.map((pt) => pt.value);
    const min = Math.min(...vals), max = Math.max(...vals);
    const span = max - min || 1;
    const x = (i) => series.points.length === 1 ? w / 2 : pad + (i * (w - pad * 2)) / (series.points.length - 1);
    const y = (v) => h - pad - ((v - min) / span) * (h - pad * 2);
    const line = series.points.map((pt, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(pt.value).toFixed(1)).join(' ');
    return (
      '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Vývoj ' + esc(series.name) + '">' +
        '<path d="' + line + '" fill="none" stroke="var(--taupe-deep)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
        series.points.map((pt, i) => '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(pt.value).toFixed(1) + '" r="' + (i === series.points.length - 1 ? 5 : 3.5) + '" fill="var(--taupe-deep)"/>').join('') +
        series.points.map((pt, i) => '<text x="' + x(i).toFixed(1) + '" y="' + (y(pt.value) - 12).toFixed(1) + '" text-anchor="middle" font-size="11" fill="var(--fg-faint)">' + pt.value + '</text>').join('') +
      '</svg>'
    );
  };

  return (
    '<header class="rise"><p class="eyebrow">Vaše čísla</p>' +
    '<h1 class="display" style="font-size:clamp(2rem,4.5vw,2.75rem);margin-top:.7rem">Zdraví</h1></header>' +
    p.labs.map((s) =>
      '<section class="surface" style="padding:1.5rem">' +
        '<div class="row" style="justify-content:space-between;gap:1rem;flex-wrap:wrap">' +
        '<h3 class="display" style="font-size:1.25rem">' + esc(s.name) + '</h3>' +
        '<span class="badge">' + esc(s.unit) + '</span></div>' +
        (s.explain ? '<p class="soft" style="margin-top:.5rem;font-size:.875rem;line-height:1.6">' + esc(s.explain) + '</p>' : '') +
        chart(s) +
        (s.reference && s.reference.note ? '<p class="faint" style="font-size:.8125rem">Orientačně: ' + esc(s.reference.note) + '</p>' : '') +
      '</section>').join('') +
    '<p class="note">Grafy ukazují vývoj, ne diagnózu. Interpretace hodnot patří vašemu lékaři — kontext, který k nim potřebuje, aplikace nemá.</p>'
  );
}

function reader() {
  if (!S.open) return '';
  const item = BY_ID.get(S.open);
  if (!item) return '';

  const checklist = item.checklist
    ? (() => {
        const groups = [];
        for (const e of item.checklist) {
          const g = e.group || 'Položky';
          let bucket = groups.find((x) => x.name === g);
          if (!bucket) groups.push((bucket = { name: g, entries: [] }));
          bucket.entries.push(e);
        }
        const doneCount = item.checklist.filter((e) => S.checked[item.id + ':' + e.id]).length;
        return (
          '<div class="surface" style="padding:1.5rem;margin-top:2rem">' +
            '<div class="row" style="justify-content:space-between"><p class="eyebrow">Checklist</p>' +
            '<span class="faint num" style="font-size:.8125rem">' + doneCount + ' / ' + item.checklist.length + '</span></div>' +
            groups.map((g) =>
              '<div style="margin-top:1.25rem"><p class="eyebrow">' + esc(g.name) + '</p>' +
              g.entries.map((e) =>
                '<button class="check" data-check="' + esc(e.id) + '" aria-pressed="' + (S.checked[item.id + ':' + e.id] ? 'true' : 'false') + '" style="margin-top:.75rem">' +
                '<span class="box">✓</span><span class="txt" style="font-size:.9375rem;line-height:1.5">' + esc(e.text) +
                (e.hint ? '<br><span class="faint" style="font-size:.8125rem">' + esc(e.hint) + '</span>' : '') +
                (e.optional ? ' <span class="badge" style="font-size:.625rem">nepovinné</span>' : '') +
                '</span></button>').join('') +
              '</div>').join('') +
          '</div>'
        );
      })()
    : '';

  const quiz = item.quiz
    ? '<div class="surface" style="padding:1.5rem;margin-top:2rem"><p class="eyebrow">Kvíz</p>' +
      item.quiz.map((q, qi) => {
        const picked = S.quiz[item.id + ':' + qi];
        return '<div style="margin-top:1.5rem"><p style="font-weight:500;font-size:.9375rem">' + esc(q.q) + '</p>' +
          '<div class="filters" style="margin-top:.75rem">' + q.options.map((o, oi) =>
            '<button data-quiz="' + qi + ':' + oi + '" aria-pressed="' + (picked === oi ? 'true' : 'false') + '"' +
            (picked != null && oi === q.correct ? ' style="border-color:var(--sage-deep)"' : '') + '>' + esc(o) + '</button>').join('') + '</div>' +
          (picked != null ? '<p class="soft" style="margin-top:.75rem;font-size:.875rem;line-height:1.6">' +
            (picked === q.correct ? '<strong>Správně. </strong>' : '<strong>Není to tak. </strong>') + esc(q.explain) + '</p>' : '') +
          '</div>';
      }).join('') + '</div>'
    : '';

  return (
    '<div class="sheet-bg" data-close="1"></div>' +
    '<article class="sheet">' +
      '<div class="sheet-head">' +
        '<span class="badge">' + esc(DATA.kindIcons[item.kind]) + ' ' + esc(DATA.kindLabels[item.kind]) + ' · ' + item.minutes + ' min</span>' +
        '<button class="iconbtn" data-close="1" aria-label="Zavřít">✕</button>' +
      '</div>' +
      '<div class="sheet-hero grain" style="' + heroStyle(item.hero) + '"></div>' +
      '<div class="sheet-body">' +
        '<h1 class="display" style="font-size:clamp(1.75rem,4vw,2.5rem)">' + esc(item.title) + '</h1>' +
        '<p class="soft" style="margin-top:.85rem;font-size:1.0625rem;line-height:1.65">' + esc(item.excerpt) + '</p>' +
        '<div class="row" style="gap:.5rem;margin-top:1.25rem;flex-wrap:wrap">' +
          item.topics.map((t) => '<span class="badge">' + esc(DATA.topicLabels[t]) + '</span>').join('') +
        '</div>' +
        (item.mediaNote ? '<p class="note" style="margin-top:1.5rem">' + esc(item.mediaNote) + '</p>' : '') +
        '<div class="prose" style="margin-top:2rem">' + md(item.body) + '</div>' +
        checklist + quiz +
        '<div style="margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid var(--line)">' +
          (item.reviewedBy ? '<p class="faint" style="font-size:.8125rem">' + esc(item.reviewedBy) + '</p>' : '') +
          (item.sources ? '<p class="faint" style="font-size:.8125rem;margin-top:.35rem">Zdroje: ' + item.sources.map(esc).join(' · ') + '</p>' : '') +
          '<p class="faint" style="font-size:.8125rem;margin-top:.35rem">Publikováno ' + esc(item.publishedOn) + '</p>' +
        '</div>' +
      '</div>' +
    '</article>'
  );
}

/* -------------------------------------------------------------- vykreslení -- */

function render() {
  const p = persona();
  const d = day();
  const app = document.getElementById('app');

  app.innerHTML =
    '<div class="topbar">' +
      '<div class="topbar-brand"><span class="display" style="font-size:1.35rem">IVF by Gabi</span>' +
      '<span class="eyebrow" style="display:block;margin-top:.15rem">Náhled</span></div>' +
      '<div class="personas">' +
        DATA.personas.map((x, i) =>
          '<button class="persona-chip" data-persona="' + i + '" aria-pressed="' + (i === S.persona ? 'true' : 'false') + '">' +
            '<span class="avatar" style="' + heroStyle(['champagne', 'sage', 'blush', 'sky', 'sand', 'dawn'][i % 6]) + '">' + esc(x.name[0]) + '</span>' +
            '<span class="who"><b>' + esc(x.name) + '</b><span>' + esc(x.tagline) + '</span></span>' +
          '</button>').join('') +
      '</div>' +
      '<div class="daynav">' +
        '<button class="iconbtn" data-day="-1" aria-label="Předchozí den"' + (S.day === 0 ? ' disabled' : '') + '>‹</button>' +
        '<span class="date num">' + esc(d.dateLabel) + '</span>' +
        '<button class="iconbtn" data-day="1" aria-label="Další den"' + (S.day === p.days.length - 1 ? ' disabled' : '') + '>›</button>' +
        '<button class="iconbtn" data-theme="1" aria-label="Přepnout motiv">◐</button>' +
      '</div>' +
    '</div>' +

    '<div class="shell">' +
      '<aside class="sidebar">' +
        '<nav class="stack" style="gap:.15rem">' +
          NAV_PRIMARY.map((n) => navLink(n)).join('') +
          '<p class="eyebrow" style="margin:1.35rem 0 .4rem;padding:0 .75rem">Vaše cesta</p>' +
          NAV_SECONDARY.map((n) => navLink(n)).join('') +
        '</nav>' +
        '<div class="surface-muted" style="margin-top:auto;padding:.85rem 1rem">' +
          '<p style="font-size:.8125rem;font-weight:500">' + esc(p.name) + '</p>' +
          '<p class="faint" style="font-size:.75rem;margin-top:.15rem">' + esc(d.phaseTitle) + '</p>' +
        '</div>' +
      '</aside>' +

      '<main class="main"><div class="page">' + SCREENS[S.screen]() + '</div></main>' +
    '</div>' +

    '<nav class="tabbar">' +
      NAV_PRIMARY.map((n) =>
        '<button data-screen="' + n.id + '"' + (S.screen === n.id ? ' aria-current="page"' : '') + '>' +
        '<i>' + n.icon + '</i><span>' + n.label + '</span></button>').join('') +
      '<button data-screen="pruvodce"' + (S.screen === 'pruvodce' ? ' aria-current="page"' : '') + '><i>❖</i><span>Průvodce</span></button>' +
    '</nav>' +

    reader();

  document.querySelector('.main').scrollTop = 0;
}

function navLink(n) {
  return '<button class="navlink" data-screen="' + n.id + '"' + (S.screen === n.id ? ' aria-current="page"' : '') + '>' +
    '<i>' + n.icon + '</i>' + n.label + '</button>';
}

/* ------------------------------------------------------------------ akce --- */

document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-persona],[data-day],[data-screen],[data-open],[data-close],[data-kind],[data-phase],[data-prompt],[data-ask],[data-mood],[data-task],[data-check],[data-quiz],[data-theme]');
  if (!t) return;

  if (t.dataset.persona !== undefined) {
    S.persona = Number(t.dataset.persona);
    S.day = persona().days.findIndex((d) => d.offset === 0);
    S.chat = []; S.mood = null; S.phase = null; S.open = null;
    return render();
  }
  if (t.dataset.day !== undefined) {
    const next = S.day + Number(t.dataset.day);
    if (next < 0 || next >= persona().days.length) return;
    S.day = next;
    return render();
  }
  if (t.dataset.screen) { S.screen = t.dataset.screen; S.phase = null; S.open = null; return render(); }
  if (t.dataset.open) { S.open = t.dataset.open; return render(); }
  if (t.dataset.close) { S.open = null; return render(); }
  if (t.dataset.kind) { S.kind = t.dataset.kind; return render(); }
  if (t.dataset.phase !== undefined) { S.phase = t.dataset.phase || null; return render(); }
  if (t.dataset.mood) { S.mood = Number(t.dataset.mood); return render(); }
  if (t.dataset.task) { S.done[day().date] = !S.done[day().date]; return render(); }
  if (t.dataset.theme) {
    const root = document.documentElement;
    const dark = root.dataset.theme
      ? root.dataset.theme === 'dark'
      : window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    return;
  }
  if (t.dataset.check) {
    const key = S.open + ':' + t.dataset.check;
    S.checked[key] = !S.checked[key];
    return render();
  }
  if (t.dataset.quiz) {
    const [qi, oi] = t.dataset.quiz.split(':').map(Number);
    S.quiz[S.open + ':' + qi] = oi;
    return render();
  }
  if (t.dataset.prompt !== undefined) {
    const a = persona().gabi.answers[Number(t.dataset.prompt)];
    S.chat.push({ role: 'user', text: a.q });
    S.chat.push({ role: 'gabi', text: a.text, refs: a.refs });
    return render();
  }
  if (t.dataset.ask) return ask();
});

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && S.open) { S.open = null; render(); }
  if (ev.target.id === 'ask' && ev.key === 'Enter') ask();
  if (ev.target.id === 'q' && ev.key === 'Enter') { S.query = ev.target.value; render(); }
});

document.addEventListener('input', (ev) => {
  if (ev.target.id === 'q') {
    S.query = ev.target.value;
    const pos = ev.target.selectionStart;
    render();
    const box = document.getElementById('q');
    if (box) { box.focus(); box.setSelectionRange(pos, pos); }
  }
  if (ev.target.dataset.slider !== undefined) {
    const out = document.getElementById('v' + ev.target.dataset.slider);
    if (out) out.textContent = ev.target.value;
  }
});

/**
 * Volná otázka. Náhled běží bez API, takže odpovídá stejnou cestou jako
 * aplikace v offline režimu: vyhledá v knihovně a nabídne, co je relevantní.
 */
function ask() {
  const box = document.getElementById('ask');
  if (!box) return;
  const q = box.value.trim();
  if (q.length < 3) return;

  const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const words = norm(q).split(/\s+/).filter((w) => w.length > 3);
  const phase = day().phaseId;
  const hits = DATA.catalog
    .map((item) => {
      const hay = norm(item.title + ' ' + item.excerpt + ' ' + item.body.slice(0, 1200));
      let score = 0;
      for (const w of words) {
        if (hay.includes(w)) score += 1;
        if (norm(item.title).includes(w)) score += 2;
      }
      if (item.phases.includes(phase)) score += 1.5;
      return { item, score };
    })
    .filter((x) => x.score > 1)
    .sort((a, b) => b.score - a.score)
    .slice(0, 4);

  const text = hits.length
    ? 'Tohle z knihovny odpovídá na to, na co se ptáte — jste **' + day().dayLabel.replace(/^Dnes (je|jste) /, '').toLowerCase() + '**, takže jsem vybírala hlavně obsah pro tuhle fázi.\n\n' +
      hits.map((h) => '- **' + h.item.title + '** — ' + h.item.excerpt).join('\n') +
      '\n\n> Tohle není lékařská rada. Když jde o vaše konkrétní hodnoty, léky nebo příznaky, patří ta otázka vašemu lékaři.'
    : 'K tomuhle zatím v knihovně nic přesného nemám. Zkuste to říct jinými slovy — nebo se zeptejte na konkrétní pojem, třeba „beta hCG“, „blastocysta“ nebo „očistky“.\n\n> Pokud jde o akutní potíže — silné krvácení, prudkou bolest, horečku — nečekejte na odpověď aplikace a volejte svoje pracoviště.';

  S.chat.push({ role: 'user', text: q });
  S.chat.push({ role: 'gabi', text, refs: hits.map((h) => h.item.id) });
  render();
}

render();
</script>
