<!doctype html>
<html lang="cs">
<meta charset="utf-8">
<!-- Aplikace se neindexuje. Je to nástroj, ne článek, a celý katalog by
     se z jednoho souboru dal sklidit najednou. -->
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Tvoje IVF cesta. Prémiový průvodce pro ženy na cestě za dítětem, každý den obsah přesně na ten den.">
<title>BlooMia</title>

<!-- Barva lišty musí sedět s pozadím stránky (--paper), jinak nad aplikací
     na telefonu svítí proužek jiné barvy. -->
<meta name="theme-color" content="#1a1620" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fbf8f7" media="(prefers-color-scheme: light)">

<!-- Přidání na plochu. Na iPhonu to není kosmetika: Safari maže data webů
     po sedmi dnech nečinnosti a stránka na ploše je z toho vyjmutá. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="BlooMia">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
